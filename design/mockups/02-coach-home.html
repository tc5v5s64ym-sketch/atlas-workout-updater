<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atlas — Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#000000;--surface:#0C0C0E;--surface-2:#161618;
    --hairline:rgba(255,255,255,0.08);--hairline-strong:rgba(255,255,255,0.16);
    --text:#F4F4F6;--muted:#8A8A90;--muted-2:#5C5C62;--green:#34D8A0;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Inter',-apple-system,system-ui,sans-serif;background:#161618;min-height:100vh;
    display:flex;align-items:center;justify-content:center;padding:32px 16px;color:var(--text);-webkit-font-smoothing:antialiased}
  .phone{width:390px;height:844px;background:var(--bg);border-radius:46px;border:1px solid #2a2a2e;
    box-shadow:0 40px 90px -20px rgba(0,0,0,.8),0 0 0 10px #0a0a0b;position:relative;overflow:hidden;display:flex;flex-direction:column}
  .statusbar{height:54px;flex:0 0 auto;display:flex;align-items:flex-end;justify-content:space-between;padding:0 30px 6px;font-size:15px;font-weight:500}
  .statusbar .right{display:flex;gap:7px;align-items:center;font-size:13px}
  .batt{border:1.4px solid var(--text);border-radius:4px;padding:1px 3px;font-size:10px;font-weight:600}
  .app{flex:1;display:flex;flex-direction:column;overflow:hidden}
  .topbar{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:10px 22px}
  .menu{display:flex;flex-direction:column;gap:4px;cursor:pointer}
  .menu span{width:20px;height:1.6px;background:var(--text);border-radius:2px}
  .wordmark{font-size:16px;font-weight:400;letter-spacing:8px;padding-left:8px}
  .avatar{width:34px;height:34px;border-radius:50%;border:1px solid var(--hairline-strong);
    display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:500;position:relative}
  .avatar .dot{position:absolute;top:0;right:0;width:8px;height:8px;border-radius:50%;background:var(--green);border:1.5px solid var(--bg)}
  .stage{flex:1;display:flex;flex-direction:column;padding:0 22px}
  .intro{margin-top:30px}
  .greeting{color:var(--muted);font-size:18px;font-weight:400}
  .headline{font-size:52px;font-weight:300;letter-spacing:-0.03em;line-height:1.02;margin-top:6px}
  .modes{margin-top:26px;display:flex;flex-direction:column;gap:12px}
  .pill{display:flex;align-items:center;gap:14px;width:max-content;min-width:210px;background:var(--surface);
    border:1px solid var(--hairline);border-radius:100px;padding:15px 24px;font-size:16px;font-weight:500;cursor:pointer;transition:border-color .2s,background .2s}
  .pill:hover{border-color:var(--hairline-strong);background:var(--surface-2)}
  .pill .ic{font-size:18px;width:22px;text-align:center}
  .spacer{flex:1}
  .composer{flex:0 0 auto;margin:0 18px 14px;background:var(--surface);border:1px solid var(--hairline);
    border-radius:26px;padding:16px 16px 12px;transition:border-color .2s}
  .composer:focus-within{border-color:var(--hairline-strong)}
  .ph{color:var(--muted-2);font-size:16px;padding:2px 4px 20px;display:flex;align-items:center}
  .caret{display:inline-block;width:2px;height:18px;background:var(--green);margin-left:1px;animation:blink 1.1s step-end infinite}
  @keyframes blink{50%{opacity:0}}
  .composer-row{display:flex;align-items:center;justify-content:space-between}
  .cbtn{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1px solid var(--hairline);color:var(--muted);font-size:20px;cursor:pointer}
  .cbtn.send{background:var(--surface-2);color:var(--text);border-color:var(--hairline-strong)}
  .home-ind{flex:0 0 auto;display:flex;justify-content:center;padding-bottom:9px}
  .home-ind i{width:134px;height:5px;border-radius:5px;background:#4a4a4e}
  .anim{opacity:0;transform:translateY(8px);animation:rise .6s cubic-bezier(.2,.7,.2,1) forwards}
  .d1{animation-delay:.05s}.d2{animation-delay:.13s}.d3{animation-delay:.22s}.d4{animation-delay:.32s}
  @keyframes rise{to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.anim{animation:none;opacity:1;transform:none}.caret{animation:none}}
  @media (max-width:430px){body{padding:0;background:var(--bg)}
    .phone{width:100%;height:100vh;height:100dvh;border-radius:0;border:none;box-shadow:none}.home-ind{display:none}}
</style>
</head>
<body>
  <div class="phone">
    <div class="statusbar">
      <div>10:32</div>
      <div class="right"><span>📶</span><span>&#xF8FF;</span><span class="batt">28</span></div>
    </div>
    <div class="app">
      <div class="topbar anim d1">
        <div class="menu"><span></span><span></span><span></span></div>
        <div class="wordmark">ATLAS</div>
        <div class="avatar">D<span class="dot"></span></div>
      </div>
      <div class="stage">
        <div class="intro">
          <div class="greeting anim d1">Good evening, Dale.</div>
          <h1 class="headline anim d2">Let&rsquo;s get<br>stronger.</h1>
        </div>
        <div class="modes anim d3">
          <div class="pill"><span class="ic">&#129504;</span>Coaches pick</div>
          <div class="pill"><span class="ic" style="color:var(--green)">&#9889;</span>Freestyle</div>
        </div>
        <div class="spacer"></div>
      </div>
      <div class="composer anim d4">
        <div class="ph">Log a set or ask anything<span class="caret"></span></div>
        <div class="composer-row">
          <div class="cbtn">+</div>
          <div class="cbtn send">&#8593;</div>
        </div>
      </div>
    </div>
    <div class="home-ind"><i></i></div>
  </div>
</body>
</html>
