<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Atlas — Body</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0A0B0E;--surface:#131419;--surface-2:#1B1D23;--line:rgba(244,243,239,.09);--line-2:rgba(244,243,239,.16);
    --ink:#F3F2ED;--muted:#9A9A93;--faint:#63635C;--ember:#E8772E;--ok:#34C77B;
    --disp:'Space Grotesk',system-ui,sans-serif;--mono:'JetBrains Mono',monospace;--body:'Inter',system-ui,sans-serif}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:var(--body);background:#050507;color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:34px 16px;-webkit-font-smoothing:antialiased}
  .phone{width:390px;height:830px;background:var(--bg);border-radius:46px;position:relative;overflow:hidden;border:1px solid #24252b;box-shadow:0 40px 100px -25px rgba(0,0,0,.9),0 0 0 9px #0c0c0e;display:flex;flex-direction:column}
  .statusbar{height:50px;flex:0 0 auto;display:flex;align-items:flex-end;justify-content:space-between;padding:0 28px 5px;font-size:14px;font-weight:500}
  .statusbar .r{display:flex;gap:6px;align-items:center;font-size:12px}
  .seg-wrap{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:6px 18px 0}
  .seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
  .seg b{font-family:var(--disp);font-weight:500;font-size:14px;padding:7px 16px;border-radius:999px;color:var(--muted)}
  .seg b.on{background:var(--surface-2);color:var(--ink)}
  .gear{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:17px}
  .gear .dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
  .subnav{flex:0 0 auto;display:flex;gap:22px;padding:14px 22px 0;border-bottom:1px solid var(--line)}
  .subnav button{background:none;border:none;font-family:var(--disp);font-weight:500;font-size:15px;color:var(--muted);padding:0 0 12px;position:relative;cursor:pointer}
  .subnav button.on{color:var(--ink)}
  .subnav button.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--ember);border-radius:2px}
  .scroll{flex:1;overflow-y:auto;padding:20px 22px 16px}
  .scroll::-webkit-scrollbar{display:none}

  /* weight glance */
  .now{display:flex;align-items:flex-end;justify-content:space-between}
  .now .w{font-family:var(--disp);font-weight:600;font-size:46px;letter-spacing:-0.02em;line-height:1}
  .now .w small{font-family:var(--body);font-weight:400;font-size:15px;color:var(--muted);margin-left:5px}
  .now .delta{text-align:right}
  .now .delta b{font-family:var(--mono);font-weight:500;font-size:15px;color:var(--ok)}
  .now .delta span{display:block;font-family:var(--mono);font-size:10px;color:var(--faint);letter-spacing:.04em;margin-top:2px}
  .chart{margin:16px 0 4px}
  .axis{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;color:var(--faint);margin-top:4px}

  .log-btn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;margin-top:18px;background:var(--ember);color:#120A04;
    border:none;border-radius:14px;padding:15px;font-family:var(--disp);font-weight:600;font-size:15px;cursor:pointer}
  .safety{font-family:var(--mono);font-size:10.5px;color:var(--faint);text-align:center;margin-top:9px;letter-spacing:.02em}

  .glance-card{margin-top:18px;background:var(--surface);border:1px solid var(--line);border-radius:16px}
  .glance-card summary{list-style:none;display:flex;align-items:center;gap:10px;padding:15px 16px;cursor:pointer}
  .glance-card summary::-webkit-details-marker{display:none}
  .glance-card .gt{font-family:var(--disp);font-weight:500;font-size:15px}
  .glance-card .gh{font-family:var(--mono);font-size:11px;color:var(--faint);margin-left:auto}
  .glance-card .chev{color:var(--faint);font-size:18px}
  .gc-body{padding:0 16px 14px}
  .row{display:flex;justify-content:space-between;font-family:var(--mono);font-size:12.5px;color:var(--muted);padding:7px 0;border-top:1px solid var(--line)}
  .row b{color:var(--ink);font-weight:500}
  .homeind{flex:0 0 auto;display:flex;justify-content:center;padding:6px 0 9px}
  .homeind i{width:130px;height:5px;border-radius:5px;background:rgba(244,243,239,.28)}
</style></head>
<body><div class="phone">
  <div class="statusbar"><div>8:53</div><div class="r"><span>&#128246;</span><span>&#xF8FF;</span><span>94</span></div></div>
  <div class="seg-wrap"><div class="seg"><b>Coach</b><b class="on">Progress</b></div><div class="gear"><span>&#9881;</span><span class="dot"></span></div></div>
  <div class="subnav"><button>Today</button><button>Trends</button><button>History</button><button class="on">Body</button></div>
  <div class="scroll">

    <div class="now">
      <div class="w">75.5<small>kg</small></div>
      <div class="delta"><b>&#9660; 0.4</b><span>LAST 30 DAYS</span></div>
    </div>

    <div class="chart">
      <svg width="100%" height="120" viewBox="0 0 326 120" preserveAspectRatio="none">
        <polyline points="0,38 40,34 78,42 116,40 150,52 188,48 222,58 260,54 298,62 326,60" fill="none" stroke="#E8772E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="326" cy="60" r="3.4" fill="#E8772E"/>
      </svg>
      <div class="axis"><span>Mar</span><span>Apr</span><span>May</span><span>Jun</span></div>
    </div>

    <button class="log-btn"><span style="font-size:18px">+</span> Log today&rsquo;s weight</button>
    <div class="safety">preview first &middot; nothing saved until you approve</div>

    <details class="glance-card">
      <summary><span class="gt">History</span><span class="gh">12 entries &middot; 76.1 &rarr; 75.5</span><span class="chev">&#8250;</span></summary>
      <div class="gc-body">
        <div class="row"><span>Jun 9</span><b>75.5 kg</b></div>
        <div class="row"><span>Jun 2</span><b>75.7 kg</b></div>
        <div class="row"><span>May 26</span><b>75.9 kg</b></div>
        <div class="row"><span>May 19</span><b>76.1 kg</b></div>
      </div>
    </details>

  </div>
  <div class="homeind"><i></i></div>
</div></body></html>
