<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Atlas — SME layer</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0A0B0E;--surface:#131419;--surface-2:#1B1D23;--line:rgba(244,243,239,.09);--line-2:rgba(244,243,239,.16);
    --ink:#F3F2ED;--muted:#9A9A93;--faint:#63635C;--ember:#E8772E;--ember-soft:rgba(232,119,46,.14);--ok:#34C77B;
    --disp:'Space Grotesk',system-ui,sans-serif;--mono:'JetBrains Mono',monospace;--body:'Inter',system-ui,sans-serif}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:var(--body);background:#050507;color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:34px 16px;-webkit-font-smoothing:antialiased}
  .phone{width:390px;height:830px;background:var(--bg);border-radius:46px;position:relative;overflow:hidden;border:1px solid #24252b;box-shadow:0 40px 100px -25px rgba(0,0,0,.9),0 0 0 9px #0c0c0e;display:flex;flex-direction:column}
  .statusbar{height:50px;flex:0 0 auto;display:flex;align-items:flex-end;justify-content:space-between;padding:0 28px 5px;font-size:14px;font-weight:500}
  .statusbar .r{display:flex;gap:6px;align-items:center;font-size:12px}
  .topbar{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:8px 22px}
  .menu{display:flex;flex-direction:column;gap:4px}.menu span{width:19px;height:1.5px;background:var(--ink);opacity:.8;border-radius:2px}
  .wordmark{font-family:var(--disp);font-weight:600;font-size:15px;letter-spacing:7px;padding-left:7px}
  .av{width:33px;height:33px;border-radius:50%;border:1px solid var(--line-2);display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-weight:500;font-size:13px;position:relative;background:var(--surface)}
  .av .dot{position:absolute;top:-1px;right:-1px;width:8px;height:8px;border-radius:50%;background:var(--ember);border:1.5px solid var(--bg)}

  .body{flex:1;display:flex;flex-direction:column;overflow:hidden}
  /* hero */
  .hero{flex:1;display:flex;flex-direction:column;padding:0 22px;overflow-y:auto}
  .hero::-webkit-scrollbar{display:none}
  .greeting{color:var(--muted);font-size:17px;margin-top:24px}
  .headline{font-family:var(--disp);font-weight:500;font-size:44px;letter-spacing:-0.02em;line-height:1.04;margin-top:7px}
  .tiles{margin-top:24px;display:flex;flex-direction:column;gap:11px;align-items:flex-start}
  .tile{display:flex;align-items:center;gap:13px;min-width:206px;background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:13px 20px;font-size:15px;font-weight:500}
  .mark{width:11px;height:11px;border-radius:50%}
  .mark.pick{background:var(--ember);box-shadow:0 0 0 3px var(--ember-soft)}.mark.free{border:1.5px solid var(--muted)}
  /* learn row — quieter than the do-tiles */
  .learn-h{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--faint);text-transform:uppercase;margin:26px 2px 11px}
  .learn{display:flex;flex-wrap:wrap;gap:9px}
  .lchip{display:inline-flex;align-items:center;gap:7px;background:transparent;border:1px solid var(--line);border-radius:999px;padding:9px 14px;font-size:13px;color:var(--muted);cursor:pointer;transition:border-color .2s,color .2s}
  .lchip:hover{border-color:var(--line-2);color:var(--ink)}
  .lchip .q{color:var(--faint);font-family:var(--mono);font-size:12px}

  /* thread */
  .thread{flex:1;overflow-y:auto;padding:10px 18px 12px;display:none;flex-direction:column;gap:13px}
  .thread::-webkit-scrollbar{display:none}
  .u{align-self:flex-end;max-width:78%;background:var(--surface-2);border:1px solid var(--line);border-radius:18px 18px 6px 18px;padding:11px 15px;font-size:15px}
  .sme{align-self:flex-start;max-width:92%;background:var(--surface);border:1px solid var(--line);border-radius:6px 18px 18px 18px;padding:14px 16px}
  .sme-eye{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--faint);text-transform:uppercase;margin-bottom:9px}
  .sme-eye svg{width:13px;height:13px}
  .sme-a{font-size:14.5px;line-height:1.55;color:var(--ink)}
  .sme-a .rir{color:var(--ember);font-weight:500}
  .based{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:13px;padding-top:11px;border-top:1px solid var(--line)}
  .based .lbl{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:var(--faint);text-transform:uppercase}
  .based .lbl svg{width:12px;height:12px}
  .src{font-family:var(--mono);font-size:11px;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:3px 9px}

  .composer{flex:0 0 auto;margin:0 18px 14px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:14px 15px 11px}
  .ph{font-size:15px;color:var(--faint);padding:2px 3px 16px}
  .crow{display:flex;align-items:center;justify-content:space-between}
  .cbtn{width:37px;height:37px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1px solid var(--line-2);color:var(--muted);font-size:19px;background:transparent}
  .cbtn.send{background:var(--ember);border-color:var(--ember);color:#120A04;font-weight:600}
  .homeind{flex:0 0 auto;display:flex;justify-content:center;padding:6px 0 9px}.homeind i{width:130px;height:5px;border-radius:5px;background:rgba(244,243,239,.28)}
  .on .hero{display:none}.on .thread{display:flex}
</style></head>
<body><div class="phone" id="phone">
  <div class="statusbar"><div>7:49</div><div class="r"><span>&#128246;</span><span>&#xF8FF;</span><span>100</span></div></div>
  <div class="topbar"><div class="menu"><span></span><span></span><span></span></div><div class="wordmark">ATLAS</div><div class="av">D<span class="dot"></span></div></div>

  <div class="body">
    <div class="hero" id="hero">
      <div class="greeting">Good evening, Dale.</div>
      <div class="headline">Let&rsquo;s get<br>stronger.</div>
      <div class="tiles">
        <div class="tile"><span class="mark pick"></span>Coaches pick</div>
        <div class="tile"><span class="mark free"></span>Freestyle</div>
      </div>
      <div class="learn-h">Learn</div>
      <div class="learn">
        <button class="lchip" data-k="size"><span class="q">?</span> Strength vs size</button>
        <button class="lchip" data-k="deload"><span class="q">?</span> What&rsquo;s a deload</button>
        <button class="lchip" data-k="rir"><span class="q">?</span> Reps in reserve</button>
      </div>
    </div>

    <div class="thread" id="thread"></div>
  </div>

  <div class="composer">
    <div class="ph">Log a set or ask anything&hellip;</div>
    <div class="crow"><div class="cbtn">+</div><div class="cbtn send">&#8593;</div></div>
  </div>
  <div class="homeind"><i></i></div>

<script>
  var BOOK='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 3.5A1 1 0 0 1 3.5 2.5H7v10H3.5a1 1 0 0 0-1 1z"/><path d="M13.5 3.5A1 1 0 0 0 12.5 2.5H9v10h3.5a1 1 0 0 1 1 1z"/></svg>';
  var DATA={
    size:{q:'Strength vs size?',
      a:'Both come from progressive overload \u2014 the difference is emphasis. Strength favors heavier loads, lower reps (about 1\u20136), longer rest, and a rep or two in reserve. Size (hypertrophy) favors moderate loads, higher reps (about 6\u201315), and working closer to failure. When you pick a goal, Atlas shifts your rep and <span class="rir">RIR</span> targets to match.',
      src:['Strength vs Hypertrophy','Progressive overload']},
    deload:{q:'What\u2019s a deload?',
      a:'A deload is a planned easy stretch \u2014 lighter loads or fewer sets for a few days \u2014 that lets accumulated fatigue clear so you come back stronger. It isn\u2019t lost progress; it\u2019s how you keep progressing without grinding into a stall or injury. Atlas suggests one when your fatigue signals stack up.',
      src:['Deload','Fatigue management']},
    rir:{q:'Reps in reserve?',
      a:'<span class="rir">RIR</span> is how many more reps you could have done before failure. <span class="rir">RIR 2</span> means you stopped with two clean reps left in the tank. It lets Atlas gauge your effort without chasing failure every set \u2014 most work sits at <span class="rir">RIR 1\u20133</span>, and the RIR on each prescribed set tells you exactly how hard to push.',
      src:['Reps in Reserve','RIR-based progression']}
  };
  var phone=document.getElementById('phone'),thread=document.getElementById('thread');
  document.querySelectorAll('.lchip').forEach(function(b){
    b.addEventListener('click',function(){
      var d=DATA[b.dataset.k]; phone.classList.add('on');
      var srcs=d.src.map(function(s){return '<span class="src">'+s+'</span>';}).join('');
      thread.innerHTML =
        '<div class="u">'+d.q+'</div>'+
        '<div class="sme"><div class="sme-eye">'+BOOK+' Learn</div>'+
        '<div class="sme-a">'+d.a+'</div>'+
        '<div class="based"><span class="lbl">'+BOOK+' Based on</span>'+srcs+'</div></div>';
    });
  });
</script>
</body></html>
