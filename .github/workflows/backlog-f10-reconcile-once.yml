name: Backlog F10 reconciliation (one-time)

on:
  push:
    branches:
      - agent/backlog-hygiene-20260730

permissions:
  contents: write

jobs:
  reconcile:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/backlog-hygiene-20260730
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Reconcile completed F10/current-state records
        run: node scripts/backlog-f10-reconcile-once.js
      - name: Verify paper-weight guard
        run: node scripts/check-paper-weight.js
      - name: Commit docs-only reconciliation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BACKLOG.md BACKLOG_ARCHIVE.md config/paper-weight.json docs/verification/BACKLOG_EDITORIAL_CLEANUP_2026-07-30.md scripts/backlog-f10-reconcile-once.js .github/workflows/backlog-f10-reconcile-once.yml
          git commit -m "docs: reconcile resolved F10 backlog records"
          git push origin HEAD:agent/backlog-hygiene-20260730
