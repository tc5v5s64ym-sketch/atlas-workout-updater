name: Codex Contract Guard

# Automated contract-guard review for every pull request, enforcing AGENTS.md.
#
# NOT a required status check yet. It becomes required only after the Phase 3
# canaries prove RED/GREEN behaviour and the owner promotes it (Phase 4).
# The Phase 3 canary runbook will live in docs/CANARY.md (added in Phase 3).
#
# Design notes:
#  - No `paths:` / `paths-ignore:` filters and no job-level skip `if:` — the
#    workflow ALWAYS runs and ALWAYS reports a conclusion. A "skipped" run can
#    therefore never silently satisfy a required check once Phase 4 lands.
#  - openai/codex-action exposes only `final-message` and has NO is_error flag
#    (unlike anthropics/claude-code-action). So the "did the review actually
#    run?" guard is synthesized in the gate step from three signals:
#       1. the Codex step's outcome (API/auth/proxy failure -> not success),
#       2. a non-empty structured output file, and
#       3. a required `review_completed: true` sentinel in that output.
#    Any non-run / incomplete run fails RED. "The job didn't fail" is NOT
#    "the review passed."

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: codex-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  contract-guard:
    name: Codex contract guard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout PR merge ref
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0 # need history so origin/main...HEAD resolves

      - name: Fetch base branch for diffing
        run: git fetch --no-tags origin main

      # Preflight: turn a missing OpenAI key into a clear, instant failure instead
      # of the cryptic "Failed to read server info" the proxy emits with no key.
      # NOTE: the repo secret is named OPEN_API_KEY (not the conventional
      # OPENAI_API_KEY) — referenced by its actual name here. Diagnostic value: if
      # this PASSES but the Codex step still fails, the key IS set and the problem
      # is OpenAI-side (revoked key, Codex/Responses access disabled, or billing).
      # Prints presence and length only — never the secret value.
      - name: Preflight — require the OpenAI API key
        env:
          OPENAI_API_KEY: ${{ secrets.OPEN_API_KEY }}
        run: |
          if [ -z "${OPENAI_API_KEY}" ]; then
            echo "::error::The OpenAI API key secret (repo secret name: OPEN_API_KEY) is not set or is empty. Add/enable it under Settings -> Secrets and variables -> Actions. The Codex proxy cannot authenticate without it; the guard fails closed (RED)."
            exit 1
          fi
          echo "OpenAI API key present (length ${#OPENAI_API_KEY})."

      # Runs last among the "work" steps and read-only. openai-api-key comes from
      # secrets; safety-strategy drops sudo; sandbox is read-only (a review never
      # needs to write the repo). Pinned to the v1 release commit SHA for
      # supply-chain hardening.
      - name: Codex contract review
        id: codex
        uses: openai/codex-action@e0fdf01220eb9a88167c4898839d273e3f2609d1 # v1
        with:
          openai-api-key: ${{ secrets.OPEN_API_KEY }} # repo secret name (not OPENAI_API_KEY)
          prompt-file: .github/codex/contract-review-prompt.md
          # output-schema-file maps to `codex exec --output-schema`
          output-schema-file: .github/codex/contract-review-schema.json
          output-file: ${{ runner.temp }}/codex-review.json
          safety-strategy: drop-sudo
          sandbox: read-only

      - name: Evaluate review and post results
        if: always()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          CODEX_OUTPUT_FILE: ${{ runner.temp }}/codex-review.json
          CODEX_STEP_OUTCOME: ${{ steps.codex.outcome }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- atlas-codex-contract-guard -->';

            async function upsertComment(body) {
              const full = `${marker}\n${body}`;
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                per_page: 100,
              });
              const existing = comments.find(c => c.body && c.body.includes(marker));
              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body: full,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body: full,
                });
              }
            }

            // ---- Fake-green guard: a non-run / incomplete review is RED ----
            if (process.env.CODEX_STEP_OUTCOME !== 'success') {
              await upsertComment(
                '## 🔴 Codex contract guard — REVIEW DID NOT RUN\n\n' +
                'The Codex step did not complete successfully (outcome: `' +
                process.env.CODEX_STEP_OUTCOME + '`) — likely a proxy/start, ' +
                'API, or auth failure. **Failing closed:** a non-run is RED, ' +
                'never green.');
              core.setFailed('Codex step did not succeed (outcome=' + process.env.CODEX_STEP_OUTCOME + ').');
              return;
            }

            let raw = '';
            try { raw = fs.readFileSync(process.env.CODEX_OUTPUT_FILE, 'utf8').trim(); } catch (e) {}
            if (!raw) {
              await upsertComment(
                '## 🔴 Codex contract guard — NO OUTPUT\n\n' +
                'The Codex step reported success but produced no structured ' +
                'output. **Failing closed:** a non-run is RED.');
              core.setFailed('Codex produced no output.');
              return;
            }

            let data;
            try { data = JSON.parse(raw); } catch (e) {
              await upsertComment(
                '## 🔴 Codex contract guard — UNPARSEABLE OUTPUT\n\n' +
                'Codex output was not valid JSON, so the review did not complete ' +
                'to the contract schema. **Failing closed.**');
              core.setFailed('Codex output was not valid JSON.');
              return;
            }
            if (data.review_completed !== true) {
              await upsertComment(
                '## 🔴 Codex contract guard — INCOMPLETE REVIEW\n\n' +
                '`review_completed` was not `true`. **Failing closed.**');
              core.setFailed('review_completed !== true.');
              return;
            }

            // ---- Verdict: any P0/P1 finding is RED ----
            const findings = Array.isArray(data.findings) ? data.findings : [];
            const order = { P0: 0, P1: 1, P2: 2 };
            findings.sort((a, b) => (order[a.severity] ?? 9) - (order[b.severity] ?? 9));
            const blocking = findings.filter(f => f.severity === 'P0' || f.severity === 'P1');

            const fmt = f => '- **' + f.severity + '** ' +
              (f.file ? '`' + f.file + (f.line != null ? ':' + f.line : '') + '` ' : '') +
              '— ' + f.rule + ': ' + f.explanation;

            let body;
            if (blocking.length > 0) {
              body = '## 🔴 Codex contract guard — ' + blocking.length +
                ' blocking finding(s)\n\n' + (data.summary || '') + '\n\n' +
                findings.map(fmt).join('\n') +
                '\n\nResolve the **P0/P1** items above (or obtain an explicit ' +
                'owner override) before merge. See `AGENTS.md`.';
            } else if (findings.length > 0) {
              body = '## 🟢 Codex contract guard — PASS (with non-blocking notes)\n\n' +
                (data.summary || '') + '\n\n' + findings.map(fmt).join('\n');
            } else {
              body = '## 🟢 Codex contract guard — PASS\n\n' +
                (data.summary || 'No contract findings.');
            }
            await upsertComment(body);

            if (blocking.length > 0) {
              core.setFailed(blocking.length + ' blocking (P0/P1) finding(s).');
            }
