name: Codex Code Review

# Mandatory Atlas correctness review using Codex's native GitHub integration.
# This workflow never calls the metered OpenAI API. Codex itself posts either:
# - a standard review containing P0/P1 findings; or
# - a thumbs-up reaction on a commit-bound @codex review request when clean.
#
# The final check fails closed until one of those current-head artifacts exists.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  review_policy:
    name: Codex review policy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      should_run: ${{ steps.policy.outputs.should_run }}
      trusted: ${{ steps.policy.outputs.trusted }}
    steps:
      - name: Classify pull request scope
        id: policy
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pull = context.payload.pull_request;
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number: pull.number,
              per_page: 100,
            });

            const changed = files.map((file) => file.filename);

            function normalize(path) {
              return path.replace(/\\/g, '/');
            }

            function requiresCodex(path) {
              const p = normalize(path);
              const lower = p.toLowerCase();

              if (lower.startsWith('.github/workflows/')) return true;
              if (/(^|\/)(agents(?:\.override)?|claude|codex)\.md$/.test(lower)) return true;
              if (/^docs\/(constitution|invariants|agent_workflow|automation_protocol|owner_checkin_rules)\.md$/.test(lower)) return true;
              if (/(^|\/)(package|package-lock|npm-shrinkwrap|yarn\.lock|pnpm-lock\.yaml)$/.test(lower)) return true;
              if (/(^|\/)(test|tests|__tests__)\//.test(lower) || /\.test\.[cm]?js$/.test(lower) || /\.spec\.[cm]?js$/.test(lower)) return true;
              if (/(^|\/)(index|server|app)\.[cm]?js$/.test(lower)) return true;
              if (/^(public|services|src|api|scripts|config)\//.test(lower)) return true;
              if (/(schema|parser|preview|save|write|coach|bug_reports|security|secret|credential|auth|env)/i.test(p)) return true;

              return false;
            }

            function safeToSkip(path) {
              const p = normalize(path);
              const lower = p.toLowerCase();

              if (requiresCodex(p)) return false;
              if (lower === 'backlog.md') return true;
              if (lower.endsWith('.md') || lower.endsWith('.mdx') || lower.endsWith('.txt')) return true;
              if (lower.startsWith('docs/') || lower.startsWith('documentation/')) return true;
              if (lower === '.github/pull_request_template.md') return true;
              if (lower.startsWith('.github/pull_request_template/')) return true;
              if (lower.startsWith('.github/issue_template/')) return true;

              return false;
            }

            const mustRun = changed.some(requiresCodex);
            const allSafe = changed.length > 0 && changed.every(safeToSkip);
            const shouldRun = mustRun || !allSafe;
            const trusted = pull.head.repo.full_name.toLowerCase() === `${owner}/${repo}`.toLowerCase();

            core.info(`Changed files:\n${changed.map((file) => `- ${file}`).join('\n')}`);
            core.setOutput('should_run', shouldRun ? 'true' : 'false');
            core.setOutput('trusted', trusted ? 'true' : 'false');

            if (!shouldRun) {
              core.notice('Codex review skipped by the unchanged safe-file policy.');
            }
            if (!trusted) {
              core.warning('Automated Atlas delivery is restricted to trusted same-repository pull requests.');
            }

  codex_gate:
    name: Codex review
    needs: review_policy
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Enforce current-head native Codex review
        uses: actions/github-script@v7
        env:
          POLICY_RESULT: ${{ needs.review_policy.result }}
          SHOULD_RUN: ${{ needs.review_policy.outputs.should_run }}
          TRUSTED: ${{ needs.review_policy.outputs.trusted }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            if (process.env.POLICY_RESULT !== 'success') {
              core.setFailed('Codex review policy did not complete.');
              return;
            }

            if (process.env.TRUSTED !== 'true') {
              core.setFailed('Codex review is restricted to trusted same-repository pull requests.');
              return;
            }

            if (process.env.SHOULD_RUN !== 'true') {
              core.notice('Codex review skipped by the unchanged safe-file policy.');
              return;
            }

            const { owner, repo } = context.repo;
            const pullNumber = context.payload.pull_request.number;
            const headSha = process.env.HEAD_SHA;
            const isCodex = (login) => /^chatgpt-codex-connector(?:\[bot\])?$/.test(login || '');

            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner,
              repo,
              pull_number: pullNumber,
              per_page: 100,
            });

            const currentCodexReviews = reviews.filter((review) =>
              isCodex(review.user?.login)
              && review.commit_id === headSha
              && review.state !== 'DISMISSED'
            );

            // Native Codex posts a standard review only when it finds a P0/P1.
            // Any current-head Codex review therefore blocks until a corrected
            // commit receives a fresh clean review.
            if (currentCodexReviews.length > 0) {
              core.setFailed('Native Codex posted P0/P1 findings on the current commit. Resolve them, push a correction, and request a fresh review.');
              return;
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: pullNumber,
              per_page: 100,
            });

            // GitHub Actions creates this marker only after headSha is the live
            // PR head. A PR author cannot edit a github-actions[bot] comment,
            // so it is the immutable link between the pushed commit and the
            // later native Codex request.
            const markerBody = `<!-- atlas-codex-review-marker:${headSha} -->`;
            const markers = comments.filter((comment) =>
              comment.user?.login === 'github-actions[bot]'
              && comment.body === markerBody
            );

            if (markers.length === 0) {
              const marker = await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pullNumber,
                body: markerBody,
              });
              core.setFailed(
                `Initialized immutable Codex review marker ${marker.data.id} for ${headSha}. `
                + `Request native review with "@codex review" and "Codex-Review-Marker: ${marker.data.id}", then rerun this check.`
              );
              return;
            }

            const marker = markers.at(-1);
            const requestMarker = `Codex-Review-Marker: ${marker.id}`;
            const requests = comments.filter((comment) =>
              typeof comment.body === 'string'
              && comment.body.includes('@codex review')
              && comment.body.includes(requestMarker)
              && comment.created_at >= marker.created_at
            );

            for (const request of requests.reverse()) {
              // A GitHub issue comment is mutable. Accept it as a commit-bound
              // request only when it has never been edited; otherwise an old
              // clean reaction could be relabeled with a newer head SHA.
              if (!request.created_at || request.updated_at !== request.created_at) {
                core.warning(`Ignoring edited Codex review request comment ${request.id}.`);
                continue;
              }

              const reactions = await github.paginate(
                github.rest.reactions.listForIssueComment,
                {
                  owner,
                  repo,
                  comment_id: request.id,
                  per_page: 100,
                }
              );

              const clean = reactions.some((reaction) =>
                reaction.content === '+1'
                && isCodex(reaction.user?.login)
                && reaction.created_at >= request.created_at
              );

              if (clean) {
                core.notice(`Native Codex approved current commit ${headSha}.`);
                return;
              }
            }

            core.setFailed(
              `No completed clean native Codex review exists for ${headSha}. `
              + `Request one with a PR comment containing "@codex review" and "${requestMarker}", then rerun this check.`
            );
