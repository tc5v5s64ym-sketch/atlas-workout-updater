name: Merge card check

# Fails when a PR body is missing the Atlas Merge Card or retains placeholders.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  check:
    name: Merge card present and filled
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate merge card
        uses: actions/github-script@v7
        with:
          script: |
            const body = (context.payload.pull_request && context.payload.pull_request.body) || '';
            const problems = [];

            if (!/Atlas Merge Card/i.test(body)) {
              problems.push('PR body is missing the "Atlas Merge Card" section. Start from .github/PULL_REQUEST_TEMPLATE.md.');
            }

            // Owner ruling 2026-07-30, final form 2026-07-31 — bounded backlog ledger. Every PR
            // records what happened to the findings it discovered. The check is LITERAL, never
            // semantic: the section must exist and carry one of the allowed dispositions. When a
            // PR says it added a backlog item, it must also name what was added, what was removed
            // to pay for it, and the resulting counts — BACKLOG.md has fixed capacity. Drift
            // Guard 7 checks the numbers; exact-head review checks that the removal was honest.
            //
            // Anchor on the HEADING, not on any mention of the phrase: a body that discusses
            // "Additional findings" in prose before the section would otherwise capture the
            // wrong span and false-fail.
            const findingsHeading = /^[ \t]*#{2,4}[ \t]*Additional findings[ \t]*$/im.exec(body);
            if (!findingsHeading) {
              problems.push('PR body is missing the "Additional findings" section (None / FIXED NOW / REJECTED / ADDED TO BOUNDED BACKLOG / OWNER DECISION REQUIRED).');
            } else {
              const section = body
                .slice(findingsHeading.index + findingsHeading[0].length)
                .split(/\n[ \t]*#{2,4}[ \t]+/)[0];

              if (!/^[ \t]*[-*][ \t]*(None|FIXED NOW|REJECTED|ADDED TO BOUNDED BACKLOG|OWNER DECISION REQUIRED)\b/im.test(section)) {
                problems.push('"Additional findings" must record one disposition: None, FIXED NOW, REJECTED, ADDED TO BOUNDED BACKLOG, or OWNER DECISION REQUIRED.');
              }

              // Two states per line, because an untouched scaffold and a typo must differ:
              //   WRITTEN — anything at all after the colon, including punctuation;
              //   FILLED  — a first character that is neither whitespace nor another colon.
              // A scaffold with every line empty is not a claim and passes. A line that was
              // written but is not filled (`added::`) is an attempted declaration and fails.
              const LINES = [
                ['added:', /^[ \t]*[-*][ \t]*added[ \t]*:[ \t]*(\S)/im],
                ['removed/archived/promoted:', /^[ \t]*[-*][ \t]*removed(?:\/archived\/promoted)?[ \t]*:[ \t]*(\S)/im],
                ['counts:', /^[ \t]*[-*][ \t]*counts[ \t]*:[ \t]*(\S)/im],
              ];
              const dispositionClaim = /^[ \t]*[-*][ \t]*ADDED TO BOUNDED BACKLOG[ \t]*:?[ \t]*(\S)/im.exec(section);
              const state = LINES.map(([label, re]) => {
                const m = re.exec(section);
                return { label, written: Boolean(m), filled: Boolean(m) && m[1] !== ':' };
              });

              const claimed = state.some((f) => f.written)
                || (dispositionClaim && dispositionClaim[1] !== ':');
              if (claimed) {
                for (const f of state) {
                  if (!f.filled) {
                    problems.push(`ADDED TO BOUNDED BACKLOG requires a filled "${f.label}" line — name the added item, what was removed to pay for it, and the resulting item/line/cap counts.`);
                  }
                }
              }
            }

            // Sentinels copied from the unfilled template. Checkboxes are reviewed
            // rather than mechanically enforced because an authorized exception can
            // legitimately leave one unchecked with an explanation.
            const sentinels = [
              '#<!-- number -->',
              'F## or explicit owner instruction',
              '<!-- one line -->',
              'one label + low/medium/high',
              '<!-- concise -->',
              'STILL BROKEN / ALREADY FIXED / PARTIALLY FIXED',
              'exact commands/checks + results',
              'independent agent/optional clean review: fixed / non-issue / none',
              // The Atlas Contract / Systems Review block (owner instruction 2026-08-03).
              // These four replace the retired 'NON-BLOCKING / READY / BLOCKING / not
              // risk-triggered' sentinel: the template row it named no longer exists, so
              // it could only false-fail a body that quotes the old wording, while the
              // fields that replaced it were unguarded. Net coverage increases.
              //
              // The first sentinel is the load-bearing one. It is a PREFIX shared by BOTH
              // placeholders that carry the required/not-required verdict — the merge-card
              // table row and the `- Required:` bullet — because that verdict is the field
              // the merge gate in CLAUDE.md actually turns on. Guarding only the head, the
              // reviewer, and the dispositions would let a PR leave "was a review required
              // at all" blank and still go green.
              'required (name the trigger) / not required (say why',
              'full 40-character commit SHA, or n/a',
              'who or what performed the review, or n/a',
              'each finding + fixed / non-issue / routed',
              'No, or exact reserved category and status',
              'evidence/script needed, or n/a',
              'active builder merges exact passing head / blocked on owner authorization',
              'One sentence. One PR equals one concern',
              'Source card/finding, duplicate/stale search',
              'Principle advanced',
              'Focused summary',
              'Commands, deterministic CI',
              'List each real finding',
              'Main/deploy verification',
            ];

            for (const sentinel of sentinels) {
              if (body.includes(sentinel)) {
                problems.push(`Merge card field left as template placeholder: "${sentinel}"`);
              }
            }

            if (problems.length) {
              core.setFailed('Incomplete merge card:\n- ' + problems.join('\n- '));
            } else {
              core.info('Merge card present and filled.');
            }
