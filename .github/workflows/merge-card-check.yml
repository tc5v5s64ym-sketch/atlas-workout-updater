name: Merge card check

# Fails when a PR body is missing the Atlas Merge Card or retains placeholders.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  check:
    name: Merge card present and filled
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate merge card
        uses: actions/github-script@v7
        with:
          script: |
            const body = (context.payload.pull_request && context.payload.pull_request.body) || '';
            const problems = [];

            if (!/Atlas Merge Card/i.test(body)) {
              problems.push('PR body is missing the "Atlas Merge Card" section. Start from .github/PULL_REQUEST_TEMPLATE.md.');
            }

            // Owner ruling 2026-07-30 — backlog intake closed. Every PR records what happened
            // to the findings it discovered. The check is literal, not semantic: the section
            // must exist and carry at least one of the four allowed dispositions. The substance
            // is reviewed, never machine-classified.
            // Anchor on the HEADING, not on any mention of the phrase: a body that discusses
            // "Additional findings" in prose before the section would otherwise capture the
            // wrong span and false-fail.
            const findingsHeading = /^[ \t]*#{2,4}[ \t]*Additional findings[ \t]*$/im.exec(body);
            if (!findingsHeading) {
              problems.push('PR body is missing the "Additional findings" section (None / FIXED NOW / REJECTED / FILED AS ISSUE).');
            } else {
              const section = body
                .slice(findingsHeading.index + findingsHeading[0].length)
                .split(/\n[ \t]*#{2,4}[ \t]+/)[0];
              if (!/^[ \t]*[-*][ \t]*(None|FIXED NOW|REJECTED|FILED AS ISSUE)\b/im.test(section)) {
                problems.push('"Additional findings" must record one disposition: None, FIXED NOW, REJECTED, or FILED AS ISSUE.');
              }
            }

            // Sentinels copied from the unfilled template. Checkboxes are reviewed
            // rather than mechanically enforced because an authorized exception can
            // legitimately leave one unchecked with an explanation.
            const sentinels = [
              '#<!-- number -->',
              'F## or explicit owner instruction',
              '<!-- one line -->',
              'one label + low/medium/high',
              '<!-- concise -->',
              'STILL BROKEN / ALREADY FIXED / PARTIALLY FIXED',
              'exact commands/checks + results',
              'independent agent/optional clean review: fixed / non-issue / none',
              'NON-BLOCKING / READY / BLOCKING / not risk-triggered',
              'No, or exact reserved category and status',
              'evidence/script needed, or n/a',
              'active builder merges exact passing head / blocked on owner authorization',
              'One sentence. One PR equals one concern',
              'Source card/finding, duplicate/stale search',
              'Principle advanced',
              'Focused summary',
              'Commands, deterministic CI',
              'List each real finding',
              'Main/deploy verification',
            ];

            for (const sentinel of sentinels) {
              if (body.includes(sentinel)) {
                problems.push(`Merge card field left as template placeholder: "${sentinel}"`);
              }
            }

            if (problems.length) {
              core.setFailed('Incomplete merge card:\n- ' + problems.join('\n- '));
            } else {
              core.info('Merge card present and filled.');
            }
