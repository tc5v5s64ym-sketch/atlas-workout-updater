name: Merge card check

# Enforces the merge card standard (docs/AUTOMATION_PROTOCOL.md §2:
# "an empty field is a failure"). Fails the PR if the body is missing the
# Atlas Merge Card section or still contains template placeholders.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  check:
    name: Merge card present and filled
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate merge card
        uses: actions/github-script@v7
        with:
          script: |
            const body = (context.payload.pull_request && context.payload.pull_request.body) || '';
            const expectedHeadSha = context.payload.pull_request && context.payload.pull_request.head.sha;
            const problems = [];

            if (!/Atlas Merge Card/i.test(body)) {
              problems.push('PR body is missing the "Atlas Merge Card" section. Start from .github/PULL_REQUEST_TEMPLATE.md.');
            }

            const rowValue = (label) => {
              const escaped = label.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
              const match = body.match(new RegExp(`\\|\\s*\\*\\*${escaped}\\*\\*\\s*\\|([^\\n]+)\\|`, 'i'));
              return match ? match[1].trim() : '';
            };

            // Sentinels that only exist in the UNFILLED template — leaving any
            // of them means a merge-card field was not completed. Covers the
            // table fields AND the prose sections (concern, current-state
            // verdict, tests). The Trust/scope safety checkboxes are NOT enforced
            // here (several are "or owner-flagged", so an unchecked box can be
            // legitimate) — they are reviewed, not gated.
            const sentinels = [
              // table
              'number, filled after open',
              'one line -->',
              'e.g. docs-only',
              'low / medium / high -->',
              'command/check + result; not-run',
              '40-char reviewed head SHA',
              'READY FOR DALE MERGE / NON-BLOCKING / BLOCKING',
              'or Yes + reserved criterion',
              'steps for Dale if needed',
              'READY FOR DALE MERGE / fix-then-review / hold-for-Dale -->',
              // prose
              'One sentence: the single concern',
              'STILL BROKEN / ALREADY FIXED',
              'Principle advanced',
              'command/check + result',
            ];
            for (const s of sentinels) {
              if (body.includes(s)) {
                problems.push(`Merge card field left as template placeholder: "${s}"`);
              }
            }

            const nativeCodexReview = rowValue('Native Codex GitHub Review');
            if (!nativeCodexReview) {
              problems.push('Merge card is missing the "Native Codex GitHub Review" row.');
            } else {
              const reviewedSha = nativeCodexReview.match(/\b[0-9a-f]{40}\b/i)?.[0];
              if (!reviewedSha) {
                problems.push('Native Codex GitHub Review must name the exact 40-character reviewed head SHA.');
              } else if (expectedHeadSha && reviewedSha.toLowerCase() !== expectedHeadSha.toLowerCase()) {
                problems.push('Native Codex GitHub Review SHA must match the current PR head SHA.');
              }
              if (!/(https:\/\/github\.com\/\S+\/pull\/\d+#\S+|discussion_r\d+|issuecomment-\d+|pullrequestreview-\d+|review id[:# ]+\d+|comment id[:# ]+\d+)/i.test(nativeCodexReview)) {
                problems.push('Native Codex GitHub Review must link or point to the native review result.');
              }
              if (!/\bno unresolved current-head P0\/P1\b/i.test(nativeCodexReview)) {
                problems.push('Native Codex GitHub Review must affirm "no unresolved current-head P0/P1".');
              }
            }

            if (problems.length) {
              core.setFailed('Incomplete merge card:\n- ' + problems.join('\n- '));
            } else {
              core.info('Merge card present and filled.');
            }
