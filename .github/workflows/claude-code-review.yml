name: Claude Code Review

# Automatically reviews every pull request with Claude.
# Replaces the previous OpenAI Codex auto-review.
#
# Setup required (one-time, by the repo owner):
#   1. Install the Claude GitHub App OR just add the API key below.
#   2. Add a repository secret named ANTHROPIC_API_KEY
#      (Settings -> Secrets and variables -> Actions -> New repository secret).
#   To switch to a Claude subscription instead of an API key, replace the
#   `anthropic_api_key` line with:
#       claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    name: Claude review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are reviewing a pull request for Atlas, a single-owner workout
            logging assistant that writes to Google Sheets. The PR branch is
            already checked out in the current working directory.

            Before reviewing, read these files for the project's rules:
              - CLAUDE.md            (operating brief, critical behaviours)
              - docs/INVARIANTS.md   (rules that must never be broken)
              - docs/CONSTITUTION.md (mission and scope)

            Review the diff with a focus on:
              - INVARIANT violations and any change to the "critical behaviours"
                table in CLAUDE.md (parser slash-notation, dry-run vs live-write
                proof fields, undo read-back/log-tab restriction).
              - The 12-column Log_Cleaned contract and 9-column Effort contract:
                flag any column added, removed, or reordered without a migration.
              - Write-path idempotency: every write path must use
                beginWrite / completeWrite / failWrite (write_id dedup).
              - The trust loop (preview -> approve -> write) and that read-only
                paths (coach, chat) never write to Sheets or invent numbers.
              - Security hard stops: no committed secrets, .env, credentials, or
                workout data; ATLAS_API_KEY never logged; GOOGLE_SHEETS_ID
                unchanged in routine PRs.
              - PR scope (Invariant PR1): PRs should be tiny, one concern each.
              - General correctness, bugs, and missing test coverage.

            Keep feedback concise and actionable. Post nothing if the PR is clean
            beyond a brief approval note.

            Use `gh pr comment` for top-level feedback.
            Use `mcp__github_inline_comment__create_inline_comment`
            (with `confirmed: true`) to flag specific lines.
            Only post GitHub comments - do not return review text as messages.

          claude_args: |
            --model claude-opus-4-8
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
