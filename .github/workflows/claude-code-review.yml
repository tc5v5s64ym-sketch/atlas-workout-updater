name: Claude Code Review

# Automatically reviews every pull request with Claude.
# Replaces the previous OpenAI Codex auto-review.
#
# Auth: uses a Claude subscription (Max/Pro) via an OAuth token.
# Setup required (one-time, by the repo owner):
#   1. Locally, with the Claude Code CLI logged in to your Max account, run:
#        claude setup-token
#      Copy the token it prints (starts with `sk-ant-oat...`).
#   2. Add it as a repository secret named CLAUDE_CODE_OAUTH_TOKEN
#      (Settings -> Secrets and variables -> Actions -> New repository secret).
#   The token expires periodically; re-run `claude setup-token` and update the
#   secret when reviews start failing auth.
#
#   To use a pay-as-you-go Anthropic API key instead, replace the
#   `claude_code_oauth_token` line with:
#       anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    name: Claude review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Claude Code Review
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are reviewing a pull request for Atlas, a single-owner workout
            logging assistant that writes to Google Sheets. The PR branch is
            already checked out in the current working directory.

            Before reviewing, read these files for the project's rules:
              - CLAUDE.md            (operating brief, critical behaviours)
              - docs/INVARIANTS.md   (rules that must never be broken)
              - docs/CONSTITUTION.md (mission and scope)

            Review the diff with a focus on:
              - INVARIANT violations and any change to the "critical behaviours"
                table in CLAUDE.md (parser slash-notation, dry-run vs live-write
                proof fields, undo read-back/log-tab restriction).
              - The 12-column Log_Cleaned contract and 9-column Effort contract:
                flag any column added, removed, or reordered without a migration.
              - Write-path idempotency: every write path must use
                beginWrite / completeWrite / failWrite (write_id dedup).
              - The trust loop (preview -> approve -> write) and that read-only
                paths (coach, chat) never write to Sheets or invent numbers.
              - Security hard stops: no committed secrets, .env, credentials, or
                workout data; ATLAS_API_KEY never logged; GOOGLE_SHEETS_ID
                unchanged in routine PRs.
              - PR scope (Invariant PR1): PRs should be tiny, one concern each.
              - General correctness, bugs, and missing test coverage.

            Keep feedback concise and actionable. Post nothing if the PR is clean
            beyond a brief approval note.

            Use `gh pr comment` for top-level feedback.
            Use `mcp__github_inline_comment__create_inline_comment`
            (with `confirmed: true`) to flag specific lines.
            Only post GitHub comments - do not return review text as messages.

          claude_args: |
            --model claude-opus-4-8
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

      # Fail the check if Claude ran but errored (e.g. bad/expired token, no
      # credits, API outage) so a green check guarantees a real review rather
      # than a silent no-op. A missing execution file is left alone: that means
      # either the prior step already failed the job (e.g. no token at all), or
      # the action benignly skipped because this PR edits the workflow itself
      # (GitHub blocks a changed review-workflow from running on its own PR).
      - name: Ensure the review actually ran
        if: always()
        run: |
          f="${{ steps.claude.outputs.execution_file }}"
          if [ -z "$f" ] || [ ! -f "$f" ]; then
            echo "No execution file - action skipped (workflow-editing PR) or already failed above. Nothing to enforce."
            exit 0
          fi
          # execution_file may be a JSON array or newline-delimited JSON; grab
          # the last "result" event either way and check its is_error flag.
          is_error=$(jq -r 'if type=="array" then .[] else . end | select(.type=="result") | .is_error' "$f" 2>/dev/null | tail -n1)
          if [ "$is_error" != "false" ]; then
            echo "::error::Claude review did not complete (is_error=${is_error:-unknown}). Verify the Max OAuth token and see the logs above."
            exit 1
          fi
          echo "Claude review completed successfully."
