name: Cold review gate

# Enforces the EXACT-HEAD cold-review requirement (docs/AUTOMATION_PROTOCOL.md
# §2/§4, CLAUDE.md cold-review model, docs/COLD_REVIEW_GATE.md): before any
# non-trivial PR merges, a fresh clean-context reviewer must review the exact
# current head with no unresolved P0/P1 finding. A review of an older head is
# stale, and a stale/missing/incomplete cold review is a FAILURE, not a pass.
#
# The gate is a commit status named `cold-review/exact-head`, set on the PR head
# SHA via the API (not the job's own conclusion) so a comment-triggered re-run
# updates the same head:
#   - green   when a trusted "Cold review: PASS / Reviewed head: <sha> /
#             P0/P1 findings: 0" marker cites a SHA equal to the current head;
#   - green   when a trusted "Cold review: N/A (trivial docs-only)" exemption
#             ALSO cites the current head (governance: trivial docs-only PRs
#             merge on CI alone), so a later push invalidates it;
#   - red     the moment a new commit is pushed (the prior review is stale),
#             until the new head is reviewed; and red when no marker exists or
#             any P0/P1 finding is unresolved.
#
# TRUST MODEL (why pull_request_target, and why it is safe here):
#   The job publishes a required status with `statuses: write`, so it must NEVER
#   run PR-head code — otherwise a PR that edits scripts/cold-review-gate.js
#   could make the gate evaluate its own unreviewed logic and self-publish green.
#   `pull_request_target` (and `issue_comment`) run the workflow definition AND
#   the checked-out code from the DEFAULT (protected) branch, never the PR head.
#   This job checks out only the default branch, loads the gate logic from there,
#   and treats the PR solely as data (its head SHA + comment text) — it never
#   checks out or executes head code, so the usual pull_request_target risk does
#   not apply. Only OWNER / MEMBER / COLLABORATOR comments count (see
#   scripts/cold-review-gate.js), so an arbitrary bot comment cannot fabricate a
#   pass. To actually gate merges, add `cold-review/exact-head` to the branch
#   protection required status checks for `main` (owner action; see
#   docs/COLD_REVIEW_GATE.md). The gate activates once this workflow is on the
#   default branch; until then it fails closed.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created, edited]

permissions:
  statuses: write
  pull-requests: read
  issues: read
  contents: read

jobs:
  evaluate:
    name: Exact-head cold review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # issue_comment fires for every issue; only act when the comment is on a PR.
    if: ${{ github.event_name != 'issue_comment' || github.event.issue.pull_request }}
    steps:
      # Load the gate logic from the DEFAULT (protected) branch only — never the
      # PR head — so a PR that changes scripts/cold-review-gate.js cannot make the
      # gate evaluate its own unreviewed code and self-publish a green status.
      - name: Checkout trusted gate logic (default branch)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Resolve PR head
        id: resolve
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            let prNumber, headSha;
            if (context.eventName === 'issue_comment') {
              prNumber = context.payload.issue.number;
              const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });
              headSha = pr.head.sha;
            } else {
              prNumber = context.payload.pull_request.number;
              headSha = context.payload.pull_request.head.sha;
            }
            core.setOutput('pr', String(prNumber));
            core.setOutput('head_sha', headSha);

      - name: Evaluate and publish cold-review status
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const { owner, repo } = context.repo;
            const prNumber = Number('${{ steps.resolve.outputs.pr }}');
            const headSha = '${{ steps.resolve.outputs.head_sha }}';
            const CONTEXT = 'cold-review/exact-head';
            const target_url = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

            // Fail CLOSED: the trusted gate logic must exist on the default
            // branch. Until this workflow has merged there, never fall back to
            // PR-head code — publish a red status and stop.
            const logicPath = path.resolve(process.env.GITHUB_WORKSPACE, 'scripts/cold-review-gate.js');
            if (!fs.existsSync(logicPath)) {
              await github.rest.repos.createCommitStatus({
                owner, repo, sha: headSha, state: 'failure', context: CONTEXT, target_url,
                description: 'Cold-review gate logic is not on the default branch yet; failing closed until it lands.',
              });
              core.notice(`cold-review/exact-head @ ${headSha.slice(0, 12)}: bootstrap — logic not on default branch`);
              return;
            }
            const gate = require(logicPath);

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: prNumber, per_page: 100,
            });

            const result = gate.evaluateColdReview({ comments, headSha });

            await github.rest.repos.createCommitStatus({
              owner, repo, sha: headSha,
              state: result.state,
              context: result.context,
              description: result.description,
              target_url,
            });

            core.notice(`cold-review/exact-head @ ${headSha.slice(0, 12)}: ${result.state.toUpperCase()} — ${result.description}`);
            await core.summary
              .addHeading('Cold review gate', 3)
              .addRaw(`Status \`${result.context}\` on \`${headSha.slice(0, 12)}\`: **${result.state}**`)
              .addRaw(`\n\n${result.description}`)
              .write();
