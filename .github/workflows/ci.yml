name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      smoke_mode:
        description: 'Smoke test mode'
        required: true
        default: 'full'
        type: choice
        options:
          - basic
          - contract
          - read-only
          - full
          - dry-run-only
          - post-switch
      expected_sheet_label:
        description: 'Expected target sheet label for logs only'
        required: true
        default: 'current'
        type: choice
        options:
          - current
          - cleaned
          - unknown
      require_no_dashboard:
        description: 'Fail if Dashboard appears in required tabs'
        required: true
        default: true
        type: boolean
      allow_empty_pending:
        description: 'Allow empty pending-exercises list'
        required: true
        default: true
        type: boolean
      expected_version:
        description: 'Optional expected /version value'
        required: false
        default: ''
        type: string

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run -s lint

      - name: Test
        run: npm test --silent

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # need history so origin/main...HEAD resolves

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Scan changed files for secrets
        run: |
          git fetch --no-tags origin main
          node scripts/check-changed-files-for-secrets.js origin/main...HEAD

  e2e-tests:
    name: E2E tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: unit-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7

  render-smoke-test:
    name: Render smoke test (Mission Control)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: unit-tests
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Smoke test Render deployment
        env:
          ATLAS_BASE_URL: ${{ secrets.ATLAS_BASE_URL }}
          ATLAS_API_KEY: ${{ secrets.ATLAS_API_KEY }}
          ATLAS_SMOKE_MODE: ${{ github.event.inputs.smoke_mode || 'basic' }}
          ATLAS_EXPECTED_SHEET_LABEL: ${{ github.event.inputs.expected_sheet_label || 'unknown' }}
          ATLAS_REQUIRE_NO_DASHBOARD: ${{ github.event.inputs.require_no_dashboard || 'true' }}
          ATLAS_ALLOW_EMPTY_PENDING: ${{ github.event.inputs.allow_empty_pending || 'true' }}
          ATLAS_EXPECTED_VERSION: ${{ github.event.inputs.expected_version || '' }}
        run: node scripts/smoke-test-render.js
