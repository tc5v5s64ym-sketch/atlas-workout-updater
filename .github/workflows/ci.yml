name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      smoke_mode:
        description: 'Smoke test mode'
        required: true
        default: 'full'
        type: choice
        options:
          - basic
          - contract
          - read-only
          - full
          - dry-run-only
          - post-switch
      expected_sheet_label:
        description: 'Expected target sheet label for logs only'
        required: true
        default: 'current'
        type: choice
        options:
          - current
          - cleaned
          - unknown
      require_no_dashboard:
        description: 'Fail if Dashboard appears in required tabs'
        required: true
        default: true
        type: boolean
      allow_empty_pending:
        description: 'Allow empty pending-exercises list'
        required: true
        default: true
        type: boolean
      expected_version:
        description: 'Optional expected /version value'
        required: false
        default: ''
        type: string

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend (Vite)
        # public/ is gitignored (PR-22) -- src/app/ is the only committed frontend
        # tree, and `npm run build` (also run via `prestart` at deploy time, see
        # package.json / docs/ARCHITECTURE.md) regenerates public/ verbatim.
        run: npm run build

      - name: Verify build output exists
        run: test -f public/index.html && test -f public/app.js && test -f public/sw.js

      - name: Lint
        run: npm run -s lint

      - name: Wiring guard (wired-or-deleted)
        # Fails if a services/*.js is unreachable from production and not in
        # config/wiring-allowlist.json (or an allowlist entry has expired).
        run: npm run -s check:wiring

      - name: Test
        run: npm test --silent

  coverage-report:
    name: Coverage report (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: unit-tests
    # REPORT-ONLY, never a gate. Owner decision (BACKLOG "PR5"): the overall
    # line % is high but masks low-coverage critical files, so a global threshold
    # would be a false sense of safety and a strict per-file threshold would fail
    # immediately. This job surfaces the numbers in the run summary for
    # visibility; it must never block a merge. Revisit a hard gate once the
    # coverage-hardening PRs (PR1–PR4) have landed.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend (Vite)
        # public/ is gitignored (PR-22); several tests (shellAssetsCoverage,
        # the unit.test.js P0-wiring block) read it from disk, and this job
        # runs in a separate checkout from unit-tests so it needs its own build.
        run: npm run build

      - name: Run tests with coverage (report only)
        run: |
          # Never fail the job on test/coverage output — this is report-only.
          node --test --experimental-test-coverage --test-reporter=spec test/*.test.js > coverage.txt 2>&1 || true
          {
            echo "## Coverage report (non-blocking — no gate)"
            echo ""
            echo "Report-only for visibility. See BACKLOG \"Test-coverage hardening\" for known gaps;"
            echo "a hard threshold is intentionally deferred until PR1–PR4 land."
            echo ""
            echo '```'
            # The summary block between the report banners; trim the reporter
            # prefix. Match the key files whether the table lists them by basename
            # ("vision.js") or by cwd-relative path ("services/vision.js") — the
            # leading boundary is (^|[ /]) so a preceding slash also matches across
            # Node versions. Drop *.test.js rows so only source shows.
            awk '/start of coverage report/{f=1} f{print} /end of coverage report/{f=0}' coverage.txt \
              | sed 's/^ℹ //' \
              | grep -E 'file +\||all files|(^|[ /])index\.js |(^|[ /])sheets\.js |(^|[ /])vision\.js |(^|[ /])coach\.js |(^|[ /])analytics\.js |(^|[ /])workoutTextParser\.js ' \
              | grep -vE 'test\.js' \
              || echo "(coverage summary not captured — see the step log)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # need history so origin/main...HEAD resolves

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Scan changed files for secrets
        run: |
          git fetch --no-tags origin main
          node scripts/check-changed-files-for-secrets.js origin/main...HEAD

  e2e-tests:
    name: E2E tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: unit-tests
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decide whether Playwright is required
        id: e2e_policy
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName !== 'pull_request') {
              core.setOutput('should_run', 'true');
              return;
            }

            const {owner, repo} = context.repo;
            const pull_number = context.payload.pull_request.number;
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number,
              per_page: 100,
            });

            const changed = files.map((file) => file.filename);

            function normalize(path) {
              return path.replace(/\\/g, '/');
            }

            function requiresPlaywright(path) {
              const p = normalize(path);
              const lower = p.toLowerCase();

              // public/ is gitignored build output (PR-22) -- it never appears as a
              // changed path in a PR diff. Frontend source changes are caught by
              // the src/ rule below.
              if (lower.startsWith('tests/e2e/')) return true;
              if (lower === 'playwright.config.js') return true;
              if (lower === 'package.json' || lower === 'package-lock.json') return true;
              if (lower === 'index.js' || lower === 'server.js' || lower === 'app.js') return true;
              if (/^(services|src|api|scripts)\//.test(lower)) return true;
              if (lower.startsWith('.github/workflows/')) return true;

              return false;
            }

            const shouldRun = changed.some(requiresPlaywright);

            core.info(`Changed files:\n${changed.map((file) => `- ${file}`).join('\n')}`);
            core.setOutput('should_run', shouldRun ? 'true' : 'false');

            if (!shouldRun) {
              core.notice('Playwright skipped by policy.');
            }

      - name: Setup Node
        if: steps.e2e_policy.outputs.should_run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        if: steps.e2e_policy.outputs.should_run == 'true'
        run: npm ci

      - name: Install Playwright Chromium
        if: steps.e2e_policy.outputs.should_run == 'true'
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        if: steps.e2e_policy.outputs.should_run == 'true'
        run: npm run test:e2e

      - name: Upload traces on failure
        if: failure() && steps.e2e_policy.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7

  render-smoke-test:
    name: Render smoke test (Mission Control)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: unit-tests
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Smoke test Render deployment
        env:
          ATLAS_BASE_URL: ${{ secrets.ATLAS_BASE_URL }}
          ATLAS_API_KEY: ${{ secrets.ATLAS_API_KEY }}
          ATLAS_SMOKE_MODE: ${{ github.event.inputs.smoke_mode || 'basic' }}
          ATLAS_EXPECTED_SHEET_LABEL: ${{ github.event.inputs.expected_sheet_label || 'unknown' }}
          ATLAS_REQUIRE_NO_DASHBOARD: ${{ github.event.inputs.require_no_dashboard || 'true' }}
          ATLAS_ALLOW_EMPTY_PENDING: ${{ github.event.inputs.allow_empty_pending || 'true' }}
          ATLAS_EXPECTED_VERSION: ${{ github.event.inputs.expected_version || '' }}
        run: node scripts/smoke-test-render.js
