name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      smoke_mode:
        description: 'Smoke test mode (basic | read-only | full | dry-run-only)'
        required: true
        default: 'full'
        type: choice
        options:
          - basic
          - read-only
          - full
          - dry-run-only
      expected_sheet_label:
        description: 'Expected sheet label for logging only (current | cleaned | unknown)'
        required: true
        default: 'current'
        type: choice
        options:
          - current
          - cleaned
          - unknown

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run -s lint

      - name: Test
        run: npm test --silent

  render-smoke-test:
    name: Render smoke test
    runs-on: ubuntu-latest
    needs: unit-tests
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Smoke test Render deployment
        env:
          ATLAS_BASE_URL: ${{ secrets.ATLAS_BASE_URL }}
          ATLAS_API_KEY: ${{ secrets.ATLAS_API_KEY }}
          ATLAS_SMOKE_MODE: ${{ github.event.inputs.smoke_mode || 'basic' }}
          ATLAS_EXPECTED_SHEET_LABEL: ${{ github.event.inputs.expected_sheet_label || 'unknown' }}
        run: node scripts/smoke-test-render.js
