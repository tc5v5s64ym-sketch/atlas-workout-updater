name: Live retest (manual)

# Manual-only, on-demand targeted live-retest scaffolding. This is NOT a merge
# gate and is NOT required in branch protection. It lines up a known
# fixed-pending-live-retest bug and prints exactly what the owner should check;
# it performs no live calls and never writes to Google Sheets (this slice).
on:
  workflow_dispatch:
    inputs:
      scenario:
        description: 'Which fixed-pending-live-retest bug to line up ("all" runs every scenario)'
        required: true
        type: choice
        options:
          - all
          - bug-20260629-153258
          - bug-20260629-153312
          - bug-20260629-003505
          - bug-20260629-002945
          - bug-20260629-204817
      target_base_url:
        description: 'Base URL to retest against. Leave blank to use the ATLAS_BASE_URL secret.'
        required: false
        default: ''
        type: string
      dry_run_only:
        description: 'Dry-run only (no live calls, no Sheets writes). Keep true.'
        required: true
        default: true
        type: boolean

jobs:
  live-retest:
    name: Live retest (manual, no-write)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Browser bootstrap only — the dry-run default needs no browser, so skip
      # the Chromium download unless a live (non-dry-run) bootstrap is requested.
      - name: Install Playwright Chromium
        if: ${{ !inputs.dry_run_only }}
        run: npx playwright install --with-deps chromium

      - name: Run live-retest scenario
        env:
          # target_base_url wins when provided; otherwise the script falls back
          # to ATLAS_BASE_URL. The secret is only a base URL, not a credential.
          ATLAS_BASE_URL: ${{ secrets.ATLAS_BASE_URL }}
          # OPTIONAL owner credential. When this secret is not configured the run
          # stays unauthenticated and behaves exactly as before (an expected reply
          # that needs a session reads INCONCLUSIVE, never a false PASS). When it
          # IS configured the harness exchanges it for a session cookie before
          # loading the app.
          #
          # It is passed through the environment only — never as a CLI argument,
          # never echoed, and never written to an artifact. Actions masks the
          # value in logs, and the harness additionally redacts it from every
          # message it prints. A dedicated secret (NOT ATLAS_API_KEY) so the
          # browser credential can be rotated on its own.
          ATLAS_ACCESS_CODE: ${{ secrets.ATLAS_ACCESS_CODE }}
        run: |
          node scripts/live-retest.js \
            --scenario "${{ inputs.scenario }}" \
            --dry-run-only "${{ inputs.dry_run_only }}" \
            --target-base-url "${{ inputs.target_base_url }}"

      # Owner experience (PR #720): render the markdown verdict report into the
      # GitHub Actions run summary. Runs even on a FAIL so the report is visible.
      - name: Publish report to run summary
        if: ${{ always() }}
        run: |
          if [ -f live-retest-artifacts/summary.md ]; then
            cat live-retest-artifacts/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## 🏋️ Atlas live-retest"
              echo ""
              echo "Dry-run (no browser, no live calls, no Sheets writes) — scenario \`${{ inputs.scenario }}\` was described only."
              echo ""
              echo "> Re-run with \`dry_run_only: false\` for a read-only live retest report."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # Privacy gate: this repository is PUBLIC, so artifacts are downloadable
      # by any logged-in GitHub user. The harness drops an AUTHENTICATED_RUN
      # marker into the artifact dir whenever a credential was supplied (before
      # any browser work, so a crash cannot skip it). Upload happens ONLY when
      # this step ran and proved the marker absent — if the step errors or is
      # skipped, its output is empty, the equality below is false, and nothing
      # uploads. Fail closed.
      - name: Check authenticated-run privacy marker
        id: privacy
        if: ${{ !inputs.dry_run_only && always() }}
        run: |
          if [ -f live-retest-artifacts/AUTHENTICATED_RUN ]; then
            echo "authenticated=true" >> "$GITHUB_OUTPUT"
            echo "Authenticated run — artifact upload will be skipped (public repository)."
          else
            echo "authenticated=false" >> "$GITHUB_OUTPUT"
          fi

      # Surface the read-only screenshots + result JSON from a browser bootstrap.
      # UNAUTHENTICATED runs only — see the privacy gate above.
      - name: Upload artifacts
        if: ${{ !inputs.dry_run_only && always() && steps.privacy.outputs.authenticated == 'false' }}
        uses: actions/upload-artifact@v4
        with:
          name: live-retest-artifacts-${{ inputs.scenario }}
          path: live-retest-artifacts/
          if-no-files-found: ignore
          retention-days: 7
